name: Bot Offerte Giochi

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # ogni 15 minuti circa (a volte GitHub ritarda di qualche minuto)
  workflow_dispatch:                # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write                   # serve per salvare stato.json (giochi gia' pubblicati)

concurrency:
  group: bot-offerte
  cancel-in-progress: false

jobs:
  giro:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Scarica i file del bot
        uses: actions/checkout@v4

      - name: Controlla Allkeyshop e pubblica su Discord
        shell: powershell
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\bot-offerte.ps1 -UnaVolta

      - name: Salva i giochi gia pubblicati
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato.json
          if git diff --cached --quiet; then
            echo "Nessun gioco nuovo da salvare"
          else
            git commit -m "Aggiorna i giochi gia pubblicati"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then exit 0; fi
              echo "Salvataggio non riuscito, riprovo tra 15 secondi ($i/5)"
              sleep 15
            done
            exit 1
          fi
